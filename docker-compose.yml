services:
  web:
    image: odoo:18.0
    container_name: odoo_transporte_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo_password}
    volumes:
      - ./custom_addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - odoo-web-data:/var/lib/odoo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: odoo_transporte_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo_password}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: odoo_transporte_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - odoo-redis-data:/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: odoo_transporte_mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./config/mosquitto/passwd:/mosquitto/config/passwd
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  gps_broker:
    build:
      context: ./gps_broker
      dockerfile: Dockerfile
    container_name: odoo_transporte_gps_broker
    ports:
      - "${GPS_BROKER_PORT:-8088}:8088"
    volumes:
      - ./gps_broker:/app
      - ./scripts:/scripts
    env_file:
      - .env
    depends_on:
      - web
      - db
      - redis
      - mosquitto
  # vmt_sync: (DESHABILITADO: El sistema opera 100% desconectado y autonomo del VMT)
  #   build:
  #     context: ./gps_broker
  #     dockerfile: Dockerfile
  #   container_name: odoo_transporte_vmt_sync
  #   command: python -u /scripts/sync_vmt_telemetry.py --forward --stream --interval 10 --broker-url http://gps_broker:8088/telemetry/gps
  #   volumes:
  #     - ./scripts:/scripts
  #   env_file:
  #     - .env
  #   depends_on:
  #     - gps_broker
  #   restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
  odoo-redis-data:
  mosquitto-data:
  mosquitto-log:
