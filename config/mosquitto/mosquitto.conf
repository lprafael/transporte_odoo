# ============================================================
# Mosquitto MQTT Broker - Configuración de Producción
# Estándar: Resolución GVMT N° 065/2024 (Paraguay)
# ============================================================

# --- Listener MQTT plano (LAN / Docker interno) ---
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
protocol mqtt

# --- Listener MQTT sobre WebSocket (para debug y paneles web) ---
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Persistencia (colas y sesiones sobreviven reinicios) ---
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# --- Logs ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

# --- Calidad de Servicio y retención ---
# QoS 1: garantía de entrega al menos una vez (standard GVMT)
max_qos 1
# Retener últimos mensajes por topic (útil para paneles que se conectan tarde)
retain_available true

# --- Seguridad: Límites de conexión ---
max_connections 500
max_packet_size 131072
