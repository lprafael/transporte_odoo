# ==============================================================================
# Configuración Nginx Reverse Proxy para Entorno de Producción con SSL/TLS
# Poliverso Transit Fleet Management & GPS Broker
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Rate Limiting para evitar abusos o loops en la ingesta GPS (10 peticiones/segundo con ráfaga de 20)
    limit_req_zone $binary_remote_addr zone=telemetry_limit:10m rate=15r/s;

    # WebSocket Connection Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstreams a los microservicios Docker
    upstream odoo_backend {
        server web:8069;
    }

    upstream broker_backend {
        server gps_broker:8088;
    }

    # --------------------------------------------------------------------------
    # Servidor HTTP (Puerto 80): Redirección o Proxy Local
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost _;

        # Para renovación de certificados SSL Let's Encrypt (Certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Broker Radar Web y WebSockets
        location /radar/ {
            proxy_pass http://broker_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket en vivo del Broker
        location /ws/ {
            proxy_pass http://broker_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Ingesta masiva de Telemetría con Rate Limiting
        location /api/v1/telemetry {
            limit_req zone=telemetry_limit burst=25 nodelay;
            proxy_pass http://broker_backend/api/v1/telemetry;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Odoo 18 Core ERP
        location / {
            proxy_pass http://odoo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 720s;
        }
    }

